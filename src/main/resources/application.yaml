spring:
  application:
    name: songover
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  modulith:
    runtime:
      verification-enabled: true
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false

songover:
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: ${STORAGE_ACCESS_KEY:songover}
    secret-key: ${STORAGE_SECRET_KEY:songover-secret}
    bucket: songover-audio
    presigned-url-ttl: 15m