services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-songover}
      POSTGRES_USER: ${POSTGRES_USER:-songover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-songover}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: